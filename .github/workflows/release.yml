name: Release PhoneCam Studio

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v2.0.0)'
        required: true
        default: 'v2.0.0'

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Prepare CI release keystore
        run: |
          keytool -genkeypair -v \
            -keystore /tmp/phonecam-ci.keystore \
            -alias phonecam \
            -keyalg RSA -keysize 2048 -validity 3650 \
            -storepass phonecamci -keypass phonecamci \
            -dname "CN=PhoneCam Studio,O=roplizer3-tech,C=EG"
          echo "ANDROID_KEYSTORE_PATH=/tmp/phonecam-ci.keystore" >> "$GITHUB_ENV"
          echo "ANDROID_KEYSTORE_PASSWORD=phonecamci" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_ALIAS=phonecam" >> "$GITHUB_ENV"
          echo "ANDROID_KEY_PASSWORD=phonecamci" >> "$GITHUB_ENV"
      - name: Build & test Android
        working-directory: android
        run: gradle testDebugUnitTest lintDebug assembleDebug assembleRelease --no-daemon
      - name: Package & Verify APKs
        run: |
          mkdir -p dist-android
          cp android/app/build/outputs/apk/debug/app-debug.apk dist-android/PhoneCam-Android-debug.apk
          cp android/app/build/outputs/apk/release/app-release.apk dist-android/PhoneCam-Android-release.apk
          BUILD_TOOLS_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)
          "$BUILD_TOOLS_DIR/apksigner" verify --verbose dist-android/PhoneCam-Android-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android-apks
          path: dist-android/*.apk
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Locate Windows 11 SDK
        id: winsdk
        shell: pwsh
        run: |
          $incRoot = "C:\Program Files (x86)\Windows Kits\10\Include"
          $sdks = Get-ChildItem $incRoot -Directory |
            Where-Object { $_.Name -match '^10\.0\.(\d+)\.0$' -and [int]$Matches[1] -ge 22000 } |
            Sort-Object { [version]$_.Name } -Descending
          if (-not $sdks) { throw "No Windows 11 SDK found" }
          "version=$($sdks[0].Name)" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
      - name: Download ONNX Runtime DirectML, DirectML, ADB Platform-Tools & AI Models
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force -Path "deps/ort", "deps/dml", "deps/platform-tools", "deps/models" | Out-Null

          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ml.onnxruntime.directml/1.20.1/microsoft.ml.onnxruntime.directml.1.20.1.nupkg" -OutFile "deps/ort.zip"
          Expand-Archive -Path "deps/ort.zip" -DestinationPath "deps/ort" -Force

          Invoke-WebRequest -Uri "https://api.nuget.org/v3-flatcontainer/microsoft.ai.directml/1.15.4/microsoft.ai.directml.1.15.4.nupkg" -OutFile "deps/dml.zip"
          Expand-Archive -Path "deps/dml.zip" -DestinationPath "deps/dml" -Force

          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile "deps/platform-tools.zip"
          Expand-Archive -Path "deps/platform-tools.zip" -DestinationPath "deps/pt-tmp" -Force
          Copy-Item "deps/pt-tmp/platform-tools/*" "deps/platform-tools/" -Recurse -Force

          Invoke-WebRequest -Uri "https://huggingface.co/onnx-community/mediapipe_selfie_segmentation/resolve/main/onnx/model.onnx" -OutFile "deps/models/selfie_segmentation.onnx"
          Invoke-WebRequest -Uri "https://github.com/opencv/opencv_zoo/raw/main/models/face_detection_yunet/face_detection_yunet_2023mar.onnx" -OutFile "deps/models/face_detection_yunet_2023mar.onnx"

          foreach ($req in @(
            "deps/ort/runtimes/win-x64/native/onnxruntime.lib",
            "deps/ort/runtimes/win-x64/native/onnxruntime.dll",
            "deps/dml/bin/x64-win/DirectML.dll",
            "deps/platform-tools/adb.exe",
            "deps/platform-tools/AdbWinApi.dll",
            "deps/platform-tools/AdbWinUsbApi.dll",
            "deps/models/selfie_segmentation.onnx",
            "deps/models/face_detection_yunet_2023mar.onnx"
          )) {
            if (-not (Test-Path $req) -or ((Get-Item $req).Length -lt 1024)) {
              throw "Missing or empty downloaded dependency: $req"
            }
          }
      - name: Build & test Native C++20
        shell: pwsh
        run: |
          $ortRoot = (Resolve-Path "deps/ort").Path.Replace('\', '/')
          $dmlRoot = (Resolve-Path "deps/dml").Path.Replace('\', '/')
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $instVer = if (Test-Path $vswhere) { (& $vswhere -latest -property installationVersion | Select-Object -First 1) } else { "" }
          if ($instVer -match '^18\.') {
            cmake -S windows/native -B windows/native/build -G "Visual Studio 18 2026" -A x64 -DCMAKE_SYSTEM_VERSION="${{ steps.winsdk.outputs.version }}" -DORT_ROOT="$ortRoot" -DDML_ROOT="$dmlRoot"
          } elseif ($instVer -match '^17\.') {
            cmake -S windows/native -B windows/native/build -G "Visual Studio 17 2022" -A x64 -DCMAKE_SYSTEM_VERSION="${{ steps.winsdk.outputs.version }}" -DORT_ROOT="$ortRoot" -DDML_ROOT="$dmlRoot"
          } else {
            cmake -S windows/native -B windows/native/build -A x64 -DCMAKE_SYSTEM_VERSION="${{ steps.winsdk.outputs.version }}" -DORT_ROOT="$ortRoot" -DDML_ROOT="$dmlRoot"
          }
          cmake --build windows/native/build --config Release --parallel
          $env:PHONECAM_TEST_MODELS_DIR = (Resolve-Path "deps/models").Path
          ctest --test-dir windows/native/build -C Release --output-on-failure
      - name: Test & Publish WPF
        shell: pwsh
        run: |
          dotnet test windows/app/PhoneCamStudio.Tests/PhoneCamStudio.Tests.csproj -c Release -p:Platform=x64
          dotnet publish windows/app/PhoneCamStudio/PhoneCamStudio.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 -o dist/PhoneCamStudio
          Copy-Item "windows/native/build/Release/PhoneCamEngine.dll" "dist/PhoneCamStudio/"
          Copy-Item "windows/native/build/Release/PhoneCamMFSource.dll" "dist/PhoneCamStudio/"
          Copy-Item "windows/native/build/Release/PhoneCamDSFilter.dll" "dist/PhoneCamStudio/"
          Copy-Item "windows/native/build/Release/PhoneCamVcamSetup.exe" "dist/PhoneCamStudio/"
          Copy-Item "deps/ort/runtimes/win-x64/native/onnxruntime.dll" "dist/PhoneCamStudio/"
          Copy-Item "deps/dml/bin/x64-win/DirectML.dll" "dist/PhoneCamStudio/"
          New-Item -ItemType Directory -Force -Path "dist/PhoneCamStudio/models", "dist/PhoneCamStudio/tools/adb" | Out-Null
          Copy-Item "deps/models/selfie_segmentation.onnx" "dist/PhoneCamStudio/models/"
          Copy-Item "deps/models/face_detection_yunet_2023mar.onnx" "dist/PhoneCamStudio/models/"
          Copy-Item "deps/platform-tools/adb.exe" "dist/PhoneCamStudio/tools/adb/"
          Copy-Item "deps/platform-tools/AdbWinApi.dll" "dist/PhoneCamStudio/tools/adb/"
          Copy-Item "deps/platform-tools/AdbWinUsbApi.dll" "dist/PhoneCamStudio/tools/adb/"
          Copy-Item "windows/installer/Install-VirtualCam.bat" "dist/PhoneCamStudio/"
          Copy-Item "windows/installer/Uninstall-VirtualCam.bat" "dist/PhoneCamStudio/"
      - name: Package Installer & Portable ZIP
        shell: pwsh
        run: |
          $tagVer = "${{ github.ref_name }}".TrimStart('v')
          if ([string]::IsNullOrWhiteSpace($tagVer) -or $tagVer -eq 'main') {
            $tagVer = "${{ inputs.tag }}".TrimStart('v')
          }
          if ([string]::IsNullOrWhiteSpace($tagVer)) { $tagVer = "2.0.0" }
          choco install innosetup -y --no-progress
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppVersion=$tagVer" windows/installer/PhoneCamStudio.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed" }
          Compress-Archive -Path "dist/PhoneCamStudio/*" -DestinationPath "dist/PhoneCamStudio-Portable-x64.zip" -Force
      - uses: actions/upload-artifact@v4
        with:
          name: windows-builds
          path: |
            dist/PhoneCamStudio-Setup-x64.exe
            dist/PhoneCamStudio-Portable-x64.zip
          if-no-files-found: error

  publish-release:
    needs: [ build-android, build-windows ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - name: Create Combined Bundle ZIP, SHA256SUMS & Publish Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ inputs.tag }}"
          if [ -z "$TAG" ]; then
            TAG="${GITHUB_REF_NAME}"
          fi
          mkdir -p bundle-tmp
          cp release-assets/PhoneCamStudio-Setup-x64.exe bundle-tmp/
          cp release-assets/PhoneCam-Android-release.apk bundle-tmp/
          cat << 'EOF' > bundle-tmp/QuickStart-AR.txt
          PhoneCam Studio v2.0.0 — دليل التشغيل السريع
          ===========================================

          1. ثبت برنامج PhoneCamStudio-Setup-x64.exe على ويندوز 11 كمسؤول (يقوم بتسجيل الكاميرا الدائمة PhoneCam Studio وفتح جدار الحماية وتجهيز ADB وفلاتر AI تلقائياً).
          2. ثبت ملف PhoneCam-Android-release.apk على موبايل الأندرويد.
          3. طرق الاتصال:
             - USB (الأسرع 60 FPS): فعّل خيارات المطور + تصحيح أخطاء USB على الموبايل، وصل الكابل واضغط "اتصال فوري عبر USB" في برنامج ويندوز (ADB مدمج ولا يحتاج تحميل إضافي).
             - Wi-Fi: تأكد أن الموبايل والكمبيوتر على نفس الشبكة واضغط "بدء البث" على الموبايل، سيظهر تلقائياً في ويندوز.
             - بلوتوث: اقترن بالموبايل من إعدادات بلوتوث ويندوز ثم اضغط تحديث و"اتصال بلوتوث".
          4. اختار كاميرا "PhoneCam Studio" من داخل واتساب أو تيليجرام أو Zoom أو OBS واستخدم تبويب "فلاتر AI/AR" وتبويب "العكس".
          EOF
          cd bundle-tmp
          zip -r "../release-assets/PhoneCamStudio-${TAG}-Android-Windows-Bundle.zip" .
          cd ../release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          gh release create "$TAG" ./* \
            --title "PhoneCam Studio $TAG" \
            --notes "PhoneCam Studio $TAG: Low-latency 60 FPS + DXVA H.264 Decode, ONNX DirectML AI Background & Landmark AR/Stylized Filters, Bundled ADB USB + Wi-Fi Active Probe + Bluetooth RFCOMM, Persistent Windows 11 System Virtual Camera." \
            --verify-tag=false || gh release upload "$TAG" ./* --clobber
